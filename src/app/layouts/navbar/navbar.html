<nav class="bg-gray-100 border-b border-gray-200">
  <div class="max-w-screen-2xl mx-auto px-4">
    <div class="flex min-h-14 items-center justify-between gap-3">

      <!-- Logo -->
      <a routerLink="/home" (click)="closeMenu()" class="flex shrink-0 items-center">
        <img src="/images/freshcart-logo.svg" alt="FreshCart" class="h-6 w-auto" />
      </a>

      <!-- Mobile Menu Button -->
      <button type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-lg text-gray-600 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-green-500 md:hidden"
        aria-label="Toggle navigation menu" [attr.aria-expanded]="isMenuOpen()" (click)="toggleMenu()">
        @if (isMenuOpen()) {
        <i class="fas fa-times text-xl"></i>
        } @else {
        <i class="fas fa-bars text-xl"></i>
        }
      </button>

      <!-- Navigation -->
      <div class="w-full md:flex md:w-auto md:flex-1 md:items-center md:justify-between" [class.hidden]="!isMenuOpen()">

        <!-- Main Links -->
        @if (isLogin()) {
        <ul class="flex flex-col gap-1 py-3 capitalize md:ms-6 md:flex-row md:items-center md:py-0">

          <li>
            <a routerLink="/home" routerLinkActive="bg-green-600 text-white" [routerLinkActiveOptions]="{ exact: true }"
              (click)="closeMenu()"
              class="block rounded-md px-3 py-2 text-gray-700 transition-colors hover:bg-green-100">Home</a>
          </li>

          <li>
            <a routerLink="/products" routerLinkActive="bg-green-600 text-white" (click)="closeMenu()"
              class="block rounded-md px-3 py-2 text-gray-700 transition-colors hover:bg-green-100">Products</a>
          </li>

          <li>
            <a routerLink="/categories" routerLinkActive="bg-green-600 text-white" (click)="closeMenu()"
              class="block rounded-md px-3 py-2 text-gray-700 transition-colors hover:bg-green-100">Categories</a>
          </li>

          <li>
            <a routerLink="/brands" routerLinkActive="bg-green-600 text-white" (click)="closeMenu()"
              class="block rounded-md px-3 py-2 text-gray-700 transition-colors hover:bg-green-100">Brands</a>
          </li>

        </ul>
        }

        <!-- Social Links and Account Actions -->
        <div
          class="flex flex-col gap-3 border-t border-gray-200 py-3 md:flex-row md:items-center md:gap-4 md:border-0 md:py-0">

          <!-- Social Links -->
          <ul class="flex flex-wrap items-center gap-4 px-3 md:gap-3 md:px-0">
            <li>
              <a href="#" aria-label="Facebook" class="text-gray-600 transition-colors hover:text-green-600">
                <i class="fab fa-facebook"></i>
              </a>
            </li>
            <li>
              <a href="#" aria-label="TikTok" class="text-gray-600 transition-colors hover:text-green-600">
                <i class="fab fa-tiktok"></i>
              </a>
            </li>
            <li>
              <a href="#" aria-label="Twitter" class="text-gray-600 transition-colors hover:text-green-600">
                <i class="fab fa-twitter"></i>
              </a>
            </li>
            <li>
              <a href="#" aria-label="YouTube" class="text-gray-600 transition-colors hover:text-green-600">
                <i class="fab fa-youtube"></i>
              </a>
            </li>
            <li>
              <a href="#" aria-label="Instagram" class="text-gray-600 transition-colors hover:text-green-600">
                <i class="fab fa-instagram"></i>
              </a>
            </li>
            <li>
              <a href="#" aria-label="LinkedIn" class="text-gray-600 transition-colors hover:text-green-600">
                <i class="fab fa-linkedin"></i>
              </a>
            </li>
          </ul>

          <!-- Account Actions -->
          <ul class="flex flex-col gap-1 px-3 capitalize md:flex-row md:items-center md:gap-2 md:px-0">

            @if (!isLogin()) {
            <li>
              <a routerLink="/login" routerLinkActive="bg-green-600 text-white" (click)="closeMenu()"
                class="block rounded-md px-3 py-2 text-gray-700 transition-colors hover:bg-green-100">Login</a>
            </li>

            <li>
              <a routerLink="/register" routerLinkActive="bg-green-600 text-white" (click)="closeMenu()"
                class="block rounded-md px-3 py-2 text-gray-700 transition-colors hover:bg-green-100">Register</a>
            </li>
            } @else {
            <li>
              <a routerLink="/cart" routerLinkActive="text-green-600" aria-label="Shopping cart" (click)="closeMenu()"
                class="block rounded-md px-3 py-2 text-xl text-gray-700 transition-colors hover:bg-green-100 md:px-2">
                <i class="fas fa-cart-shopping"></i>
              </a>
            </li>

            <li>
              <a routerLink="/logOut" (click)="closeMenu(); authService.logOut()" role="button"
                class="block rounded-md px-3 py-2 text-gray-700 transition-colors hover:bg-green-100">Log Out</a>
            </li>
            }

          </ul>
        </div>
      </div>

    </div>
  </div>
</nav>
