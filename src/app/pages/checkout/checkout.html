<section class="mx-auto my-6 w-full max-w-2xl px-4 sm:my-8 sm:px-6">
  <div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm sm:p-6 md:p-8">

    <h1 class="mb-6 text-center text-2xl font-semibold text-green-600 sm:text-3xl">
      Checkout
    </h1>

    <form [formGroup]="checkOutForm" (ngSubmit)="submitForm()">

      <!-- Details -->
      <div class="mb-4">
        <label for="details" class="mb-2 block text-sm font-medium text-gray-900 sm:text-base">
          Details
        </label>

        <textarea formControlName="details" id="details" rows="4" placeholder="Enter your address details"
          class="form-control w-full resize-y"></textarea>
      </div>

      <!-- Phone -->
      <div class="mb-4">
        <label for="phone" class="mb-2 block text-sm font-medium text-gray-900 sm:text-base">
          Phone
        </label>

        <input formControlName="phone" id="phone" type="tel" autocomplete="tel" placeholder="Enter your phone number"
          class="form-control w-full" />
      </div>

      <!-- City -->
      <div class="mb-6">
        <label for="city" class="mb-2 block text-sm font-medium text-gray-900 sm:text-base">
          City
        </label>

        <input formControlName="city" id="city" type="text" autocomplete="address-level2" placeholder="Enter your city"
          class="form-control w-full" />
      </div>

      <!-- Online Payment -->
      <button [disabled]="checkOutForm.invalid" type="submit"
        class="btn-main flex w-full items-center justify-center gap-3 rounded-lg px-4 py-3 disabled:cursor-not-allowed disabled:opacity-60 sm:w-auto sm:min-w-52">
        <img src="/images/visa-payment.webp" alt="Visa" class="h-9 w-12 object-contain sm:h-10" />

        <span>Online Payment</span>
      </button>

    </form>
  </div>
</section>
