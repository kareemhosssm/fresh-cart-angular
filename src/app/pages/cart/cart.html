@if (cartDetails.totalCartPrice) {
<section class="main-sec mx-auto w-full max-w-screen-xl px-4 py-6 sm:px-6 sm:py-8 lg:px-8">

  <h1 class="mb-4 text-center text-2xl font-semibold text-green-600 sm:text-3xl">
    Shop Cart
  </h1>

  <div class="mb-5 flex flex-col gap-1 rounded-lg bg-gray-50 p-4 sm:flex-row sm:items-center sm:justify-between">
    <span class="text-main text-sm sm:text-base">
      Total Cart Price:
    </span>

    <span class="text-lg font-semibold text-green-600">
      {{ cartDetails.totalCartPrice | currency : "GBP" }}
    </span>
  </div>

  @for (prod of cartDetails.products; track prod.product.id) {
  <div
    class="mb-4 grid grid-cols-1 items-center gap-4 border-b border-gray-200 pb-4 sm:gap-5 md:grid-cols-[120px_minmax(0,1fr)]">

    <!-- Product Image -->
    <div class="mx-auto w-full max-w-[180px] sm:max-w-[200px] md:max-w-none">
      <img [src]="prod.product.imageCover" class="h-36 w-full object-contain sm:h-40 md:h-28"
        [alt]="prod.product.title" />
    </div>

    <!-- Product Info -->
    <div class="flex min-w-0 flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">

      <div class="min-w-0">
        <h3 class="break-words text-base font-medium sm:text-lg">
          {{ prod.product.title }}
        </h3>

        <h4 class="my-2 text-sm text-gray-600 sm:text-base">
          {{ prod.price | currency : "GBP" }}
        </h4>

        <button type="button" (click)="removeITem(prod.product.id)"
          class="inline-flex items-center gap-2 text-sm text-green-600 transition hover:text-green-700">
          <i class="fas fa-trash-can"></i>
          Remove
        </button>
      </div>

      <!-- Quantity Controls -->
      <div class="flex items-center justify-between gap-4 sm:justify-end">
        <button type="button" (click)="updateCount(prod.product.id, prod.count + 1)"
          class="text-2xl text-green-600 transition hover:text-green-700 sm:text-3xl" aria-label="Increase quantity">
          <i class="fa-regular fa-square-plus"></i>
        </button>

        <span class="min-w-6 text-center font-medium">
          {{ prod.count }}
        </span>

        <button type="button" (click)="updateCount(prod.product.id, prod.count - 1)"
          class="text-2xl text-green-600 transition hover:text-green-700 sm:text-3xl" aria-label="Decrease quantity">
          <i class="fa-regular fa-square-minus"></i>
        </button>
      </div>

    </div>
  </div>
  }

  <div class="mt-6 flex justify-center sm:justify-end">
    <button type="button" class="btn-main w-full sm:w-auto" [routerLink]="['/checkout', cartDetails._id]">
      Check Out
    </button>
  </div>

</section>
} @else {
<section class="mx-auto w-full px-4 py-12 text-center sm:py-16">
  <i class="fas fa-shopping-cart mb-4 text-4xl text-gray-400"></i>
  <h1 class="text-xl font-semibold text-gray-600 sm:text-2xl">
    No data Found
  </h1>
</section>
}
