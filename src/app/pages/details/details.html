@if (detailsProduct) {
<section class="mx-auto w-full max-w-screen-xl px-4 py-6 sm:px-6 sm:py-8 lg:px-8">
    <h1 class="my-4 text-center text-2xl font-semibold text-main sm:text-3xl">
        Details Product
    </h1>

    <div class="grid grid-cols-1 items-center gap-6 sm:gap-8 md:grid-cols-[minmax(0,1fr)_minmax(0,2fr)] lg:gap-12">

        <!-- Product Image -->
        <div class="mx-auto w-full max-w-sm md:max-w-none">
            <img [src]="detailsProduct.imageCover"
                class="mx-auto h-64 w-full object-contain sm:h-80 md:h-auto md:max-h-[450px]"
                [alt]="detailsProduct.title" />
        </div>

        <!-- Product Details -->
        <div class="min-w-0">
            <h2 class="mb-3 break-words text-2xl font-semibold sm:text-3xl">
                {{ detailsProduct.title }}
            </h2>

            <p class="mb-4 break-words text-sm leading-7 text-gray-500 sm:text-base">
                {{ detailsProduct.description }}
            </p>

            <h3 class="mb-5 text-sm font-medium text-gray-700 sm:text-base">
                {{ detailsProduct.category.name }}
            </h3>

            <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
                <span class="font-medium">
                    {{ detailsProduct.price }} EGP
                </span>

                <div class="flex items-center gap-1">
                    <i class="fas fa-star text-yellow-300"></i>
                    <span class="text-gray-500">
                        {{ detailsProduct.ratingsAverage }}
                    </span>
                </div>
            </div>

            <button class="btn-main w-full">
                + Add To Cart
            </button>
        </div>

    </div>
</section>
}
