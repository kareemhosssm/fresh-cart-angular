<section class="mx-auto max-w-screen-2xl px-3 pb-8 pt-6 sm:px-4 lg:px-6">

    <!-- Page Header -->
    <div class="mb-6 text-center">
        <h2 class="mb-2 text-2xl font-semibold sm:text-3xl lg:text-4xl">
            Our Brands
        </h2>

        <p class="text-sm text-gray-500 sm:text-base">
            Discover products from your favorite brands.
        </p>
    </div>

    <!-- Brands Grid -->
    <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 sm:gap-4 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6">

        @for (brand of brands; track brand._id) {

        <div
            class="group flex min-w-0 flex-col items-center overflow-hidden rounded-xl border border-gray-100 bg-white p-4 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:border-green-400 hover:shadow-lg">

            <!-- Brand Logo -->
            <div class="flex h-28 w-full items-center justify-center p-3 sm:h-36">
                <img [src]="brand.image" [alt]="brand.name" loading="lazy"
                    class="max-h-full max-w-full object-contain transition-transform duration-300 group-hover:scale-110" />
            </div>

            <!-- Brand Name -->
            <h3
                class="mt-3 text-center text-sm font-semibold text-gray-700 transition-colors group-hover:text-green-600 sm:text-base">
                {{ brand.name }}
            </h3>

        </div>

        } @empty {
        <div class="col-span-full py-12 text-center text-gray-500">
            No brands found.
        </div>
        }

    </div>

</section>
