<section class="mx-auto w-full px-4 py-6 sm:px-6 sm:py-8">
  <h1 class="my-4 text-center text-3xl font-semibold text-main sm:text-4xl">
    Forgot Password
  </h1>

  @if (step == 1) {
  <form [formGroup]="verifyEmail" class="mx-auto w-full max-w-2xl rounded-xl bg-main-light p-4 shadow sm:p-6 md:p-8"
    (ngSubmit)="onSubmitEmail()">
    <div class="my-3">
      <label for="email" class="mb-2 block text-sm font-medium text-gray-800 sm:text-base">
        Email
      </label>

      <input formControlName="email" id="email" type="email" placeholder="Enter your email" autocomplete="email"
        class="form-control w-full" />
    </div>

    <div class="mt-5 flex justify-center">
      <button type="submit" [disabled]="verifyEmail.invalid"
        class="btn-main w-full sm:w-auto disabled:cursor-not-allowed disabled:opacity-60">
        Verify Email
      </button>
    </div>
  </form>
  } @else if (step == 2) {
  <form [formGroup]="verifyCode" class="mx-auto w-full max-w-2xl rounded-xl bg-main-light p-4 shadow sm:p-6 md:p-8"
    (ngSubmit)="onSubmitCode()">
    <div class="my-3">
      <label for="resetCode" class="mb-2 block text-sm font-medium text-gray-800 sm:text-base">
        Reset Code
      </label>

      <input formControlName="resetCode" id="resetCode" type="text" placeholder="Enter your reset code"
        autocomplete="one-time-code" class="form-control w-full" />
    </div>

    <div class="mt-5 flex justify-center">
      <button type="submit" [disabled]="verifyCode.invalid"
        class="btn-main w-full sm:w-auto disabled:cursor-not-allowed disabled:opacity-60">
        Verify Code
      </button>
    </div>
  </form>
  } @else if (step == 3) {
  <form [formGroup]="resetPassword" class="mx-auto w-full max-w-2xl rounded-xl bg-main-light p-4 shadow sm:p-6 md:p-8"
    (ngSubmit)="onSubmitNewPassword()">
    <div class="my-3">
      <label for="resetEmail" class="mb-2 block text-sm font-medium text-gray-800 sm:text-base">
        Email
      </label>

      <input readonly formControlName="email" id="resetEmail" type="email" placeholder="Enter your email"
        autocomplete="email" class="form-control w-full" />
    </div>

    <div class="my-3">
      <label for="newPassword" class="mb-2 block text-sm font-medium text-gray-800 sm:text-base">
        New Password
      </label>

      <input formControlName="newPassword" id="newPassword" type="password" placeholder="Enter your new password"
        autocomplete="new-password" class="form-control w-full" />
    </div>

    <div class="mt-5 flex justify-center">
      <button type="submit" [disabled]="resetPassword.invalid"
        class="btn-main w-full sm:w-auto disabled:cursor-not-allowed disabled:opacity-60">
        Reset Password
      </button>
    </div>
  </form>
  }
</section>
